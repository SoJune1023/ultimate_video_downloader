[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ultimate_downloader"
version = "1.0.0"
description = "유튜브 / 인스타그램 릴스 통합 다운로더"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.1.0",
    "certifi>=2024.1.0",
]

[project.scripts]
ultimate_downloader = "src.__main__:main"

[tool.setuptools]
packages = ["src"]
